# Dataset candidates for AeroDelay AI - departure delay >= 15 min prediction
# Ordered by recommendation; select the BTS dataset as the training source.

bts_on_time:
  name: "BTS On-Time Performance - Reporting Carrier"
  source_url: "https://transtats.bts.gov/"
  download_url: "https://transtats.bts.gov/PREZIP/On_Time_Reporting_Carrier_On_Time_Performance_1987_present_{{year}}_{{month}}.zip"
  license: "Public domain - US Government data. No official restriction on use, modification, or redistribution."
  download_method: "direct_zip"
  file_format: "zipped_csv"
  date_coverage: "1987-present (monthly records)"
  record_count_per_month: 5000  # Approximate: ~5000+ flights per month
  target_column: "DepDel15"
  target_definition: "1 = departure delay >= 15 minutes, 0 otherwise"
  target_available_directly: True
  key_columns:
    - Year
    - Month
    - DayOfWeek
    - Origin
    - Dest
    - CRSDepTime
    - DepDel15
    - Reporting_Airline
    - Distance
    - CRSElapsedTime
    - Cancelled
    - Diverted
    - CancellationCode
  leakage_columns:
    - DepTime
    - DepDelay
    - TaxiOut
    - WheelsOff
    - ArrTime
    - ArrDelay
    - ActualElapsedTime
  pre_departure_predictors:
    - Reporting_Airline
    - Origin
    - Dest
    - Month
    - Distance
    - Cancelled
    - Diverted
    - DayOfWeek
    - CRSDepTime
    - CRSElapsedTime
  meaningful_predictors_count: 7
  usable_records_minimum: 500
  class_balance_expected: "~73% on-time, ~27% delayed (per month)"
  download_notes: |
    Download from https://transtats.bts.gov/DL_SelectFields.aspx?QO_fu146_anzr=&gnoyr_VQ=FGJ
    or via PREZIP URLs: https://transtats.bts.gov/PREZIP/On_Time_Reporting_Carrier_On_Time_Performance_1987_present_{{year}}_{{month}}.zip
    One CSV per month; extract and combine.
  license_notes: "US Government data - public domain. No restrictions on use, modification, or redistribution."

